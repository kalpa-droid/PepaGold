backend:
  name: github
  repo: kalpa-droid/PepaGold
  branch: main
  app_id: "Ov23ctY1xR7QYk1CeP3F"

locale: "es"

media_folder: "assets/imagenes/blog"
public_folder: "/assets/imagenes/blog"

site_url: https://pepagold.blog
display_url: https://pepagold.blog/blog/
logo_url: /assets/imagenes/icono.svg

collections:
  - name: "posts"
    label: "Artículos del blog"
    label_singular: "Artículo"
    folder: "blog/posts"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "yaml-frontmatter"
    summary: "{{title}} — {{locale}}"
    sortable_fields: ["date", "title", "category"]
    fields:
      - { label: "Título", name: "title", widget: "string", hint: "El H1 del artículo, con la keyword principal" }
      - { label: "Descripción (meta description)", name: "description", widget: "text", hint: "155 caracteres aprox, para Google y redes" }
      - { label: "Slug (URL)", name: "slug", widget: "string", hint: "Solo minúsculas y guiones, ej: viento-zonda-cuidado-piel" }
      - label: "Fecha"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
      - label: "Idioma / región"
        name: "locale"
        widget: "select"
        hint: "Define en qué carpeta de idioma se publica"
        options:
          - { label: "🇦🇷 Español (Argentina)", value: "es-ar" }
          - { label: "🇲🇽 Español (México)", value: "es-mx" }
          - { label: "🇪🇸 Español (España)", value: "es-es" }
          - { label: "🇺🇸 English (US)", value: "en-us" }
          - { label: "🇫🇷 Français", value: "fr-fr" }
          - { label: "🇩🇪 Deutsch", value: "de-de" }
          - { label: "🇮🇹 Italiano", value: "it-it" }
          - { label: "🇧🇷 Português (Brasil)", value: "pt-br" }
          - { label: "🇷🇺 Русский", value: "ru-ru" }
          - { label: "🇨🇳 简体中文", value: "zh-hans" }
      - label: "Categoría"
        name: "category"
        widget: "select"
        options:
          - { label: "🔬 Ciencia de la Piel", value: "barrera-cutanea" }
          - { label: "🌱 Sostenibilidad y Ecología", value: "sostenibilidad" }
          - { label: "🧘‍♀️ Rutinas y Skinimalismo", value: "rutinas-minimalismo" }
          - { label: "⚖️ Comparativas y Economía", value: "comparativas-economia" }
          - { label: "🏜️ Guías Regionales y Clima", value: "guias-regionales" }
          - { label: "🧼 Uso y Cuidado del Producto", value: "cuidado-producto" }
          - { label: "💬 Testimonios y Estilo de Vida", value: "testimonios-estilo-vida" }
          - { label: "📈 Tendencias Globales", value: "tendencias-skincare" }
      - { label: "Etiqueta de categoría (texto visible)", name: "category_label", widget: "string", required: false, hint: "Ej: 'Guías regionales' — se muestra arriba del título" }
      - label: "Concepto (agrupa las versiones en otros idiomas)"
        name: "concept"
        widget: "string"
        required: false
        hint: "Mismo valor en las traducciones de un mismo artículo. Sirve para enlazar hreflang entre idiomas."
      - { label: "Fenómeno/referencia local (opcional)", name: "local_phenomenon", widget: "string", required: false, hint: "Ej: Föhn, Santa Ana winds, Viento Zonda" }
      - { label: "Etiqueta de región (opcional, se muestra como badge)", name: "region_label", widget: "string", required: false, hint: "Ej: Salta y Cuyo, Argentina" }
      - label: "Archivos Multimedia (Portada y ZigZag)"
        name: "media"
        widget: "list"
        required: false
        hint: "Puedes subir 1 o más fotos y videos (.mp4). Se organizarán automáticamente."
        field: {label: "Archivo", name: "file", widget: "file"}
      - label: "Autor"
        name: "author"
        widget: "string"
        default: "PepaGold"
      - label: "Epígrafe (opcional)"
        name: "epigraph"
        widget: "object"
        required: false
        fields:
          - { label: "Texto", name: "text", widget: "text" }
          - { label: "Autor (opcional)", name: "author", widget: "string", required: false }
      - label: "Resumen: En 30 Segundos (opcional)"
        name: "summary"
        widget: "list"
        required: false
        hint: "Puntos clave del artículo"
        field: { label: "Punto", name: "punto", widget: "string" }
      - label: "Mostrar Enlace a la Ciencia"
        name: "show_science_link"
        widget: "boolean"
        default: true
        hint: "Muestra el bloque 'Lo que dice la ciencia' al final."
      - label: "Artículos Relacionados (opcional)"
        name: "related"
        widget: "list"
        required: false
        hint: "Agrega los Slugs exactos de otros artículos"
        field: { label: "Slug", name: "slug", widget: "string" }
      - label: "Preguntas frecuentes (opcional, genera schema FAQ)"
        name: "faq"
        widget: "list"
        required: false
        fields:
          - { label: "Pregunta", name: "q", widget: "string" }
          - { label: "Respuesta", name: "a", widget: "text" }
      - label: "Contenido del artículo"
        name: "body"
        widget: "markdown"
        hint: "Pegá o escribí el artículo acá. Se convierte solo en HTML al publicar."
