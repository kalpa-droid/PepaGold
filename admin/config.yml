backend:
  name: github
  repo: kalpa-droid/PepaGold
  branch: main
  app_id: "Ov23ctY1xR7QYk1CeP3F"

locale: "es"

i18n:
  structure: multiple_folders
  locales: [es-ar, es-mx, es-es, en-us, fr-fr, de-de, it-it, pt-br, ru-ru, zh-hans]
  default_locale: es-ar

media_folder: "assets/imagenes/blog"
public_folder: "/assets/imagenes/blog"

site_url: https://pepagold.blog
display_url: https://pepagold.blog/blog/
logo_url: /assets/imagenes/icono.svg

collections:
  - name: "posts"
    label: "Artículos del blog"
    label_singular: "Artículo"
    folder: "blog/posts"
    i18n: true
    media_folder: "{{slug}}"
    public_folder: "/assets/imagenes/blog/{{slug}}"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "yaml-frontmatter"
    summary: "{{title}} — {{locale}}"
    sortable_fields: ["date", "title", "category"]
    view_filters:
      - { label: "🔬 Ciencia de la Piel", field: "category", pattern: "barrera-cutanea" }
      - { label: "🌱 Sostenibilidad y Ecología", field: "category", pattern: "sostenibilidad" }
      - { label: "🧘‍♀️ Rutinas y Skinimalismo", field: "category", pattern: "rutinas-minimalismo" }
      - { label: "⚖️ Comparativas y Economía", field: "category", pattern: "comparativas-economia" }
      - { label: "🏜️ Guías Regionales y Clima", field: "category", pattern: "guias-regionales" }
      - { label: "🧼 Uso y Cuidado del Producto", field: "category", pattern: "cuidado-producto" }
      - { label: "💬 Testimonios y Estilo de Vida", field: "category", pattern: "testimonios-estilo-vida" }
      - { label: "📈 Tendencias Globales", field: "category", pattern: "tendencias-skincare" }
    fields:
      - { label: "Título", name: "title", widget: "string", i18n: true, hint: "El H1 del artículo" }
      - label: "Categoría"
        name: "category"
        widget: "select"
        i18n: duplicate
        options:
          - { label: "🔬 Ciencia de la Piel", value: "barrera-cutanea" }
          - { label: "🌱 Sostenibilidad y Ecología", value: "sostenibilidad" }
          - { label: "🧘‍♀️ Rutinas y Skinimalismo", value: "rutinas-minimalismo" }
          - { label: "⚖️ Comparativas y Economía", value: "comparativas-economia" }
          - { label: "🏜️ Guías Regionales y Clima", value: "guias-regionales" }
          - { label: "🧼 Uso y Cuidado del Producto", value: "cuidado-producto" }
          - { label: "💬 Testimonios y Estilo de Vida", value: "testimonios-estilo-vida" }
          - { label: "📈 Tendencias Globales", value: "tendencias-skincare" }
      - { label: "Etiqueta de categoría (texto visible)", name: "category_label", widget: "string", required: false, i18n: true, hint: "Ej: 'Guías regionales' — se muestra arriba del título" }
      - label: "Archivos Multimedia (Galería)"
        name: "media"
        widget: "list"
        required: false
        i18n: duplicate
        hint: "LA PRIMERA IMAGEN SERÁ LA PORTADA. Sube fotos o videos (.mp4). Usa la descripción para decirle a la IA dónde insertarlas en el texto."
        fields:
          - {label: "Archivo", name: "file", widget: "file"}
          - {label: "Descripción / Ubicación", name: "description", widget: "string", required: false, hint: "Ej: 'Ubicar en el paso 2', 'Imagen principal'"}
      - label: "Contenido del artículo"
        name: "body"
        widget: "markdown"
        i18n: true
        hint: "Pegá o escribí el artículo acá."
      - label: "--- METADATOS Y SEO (Opcionales o generados por IA) ---"
        name: "separator1"
        widget: "hidden"
        default: "separator"
        required: false
      - { label: "Descripción (meta description)", name: "description", widget: "text", i18n: true, hint: "155 caracteres aprox" }
      - { label: "Slug (URL)", name: "slug", widget: "string", i18n: true, hint: "Solo minúsculas y guiones" }
      - label: "Concepto (ID de traducción)"
        name: "concept"
        widget: "string"
        required: false
        i18n: duplicate
        hint: "Mismo valor en todas las traducciones de un artículo."
      - label: "Fecha"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        i18n: duplicate
      - label: "Idioma / región"
        name: "locale"
        widget: "select"
        i18n: duplicate
        options:
          - { label: "🇦🇷 Español (Argentina)", value: "es-ar" }
          - { label: "🇲🇽 Español (México)", value: "es-mx" }
          - { label: "🇪🇸 Español (España)", value: "es-es" }
          - { label: "🇺🇸 English (US)", value: "en-us" }
          - { label: "🇫🇷 Français", value: "fr-fr" }
          - { label: "🇩🇪 Deutsch", value: "de-de" }
          - { label: "🇮🇹 Italiano", value: "it-it" }
          - { label: "🇧🇷 Português (Brasil)", value: "pt-br" }
          - { label: "🇷🇺 Русский", value: "ru-ru" }
          - { label: "🇨🇳 简体中文", value: "zh-hans" }
      - { label: "Fenómeno/referencia local", name: "local_phenomenon", widget: "string", required: false, i18n: true }
      - { label: "Etiqueta de región", name: "region_label", widget: "string", required: false, i18n: true }
      - label: "Autor"
        name: "author"
        widget: "string"
        default: "PepaGold"
        i18n: duplicate
      - label: "Epígrafe"
        name: "epigraph"
        widget: "object"
        required: false
        i18n: true
        fields:
          - { label: "Texto", name: "text", widget: "text", required: false }
          - { label: "Autor", name: "author", widget: "string", required: false }
      - label: "Resumen: En 30 Segundos"
        name: "summary"
        widget: "list"
        required: false
        i18n: true
        field: { label: "Punto", name: "punto", widget: "string" }
      - label: "Artículos Relacionados"
        name: "related"
        widget: "list"
        required: false
        i18n: duplicate
        field: { label: "Slug", name: "slug", widget: "string" }
      - label: "Preguntas frecuentes (FAQ)"
        name: "faq"
        widget: "list"
        required: false
        i18n: true
        fields:
          - { label: "Pregunta", name: "q", widget: "string", required: false }
          - { label: "Respuesta", name: "a", widget: "text", required: false }
      - label: "Mostrar Enlace a la Ciencia"
        name: "show_science_link"
        widget: "boolean"
        default: true
        i18n: duplicate
