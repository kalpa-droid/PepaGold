backend:
  name: github
  repo: kalpa-droid/PepaGold
  branch: main

media_folder: "assets/imagenes/blog"
public_folder: "/assets/imagenes/blog"

i18n:
  structure: multiple_folders
  locales: [es, mx, us, fr, de, it, pt, ru, zh]
  default_locale: es

collections:
  - name: "blog"
    label: "Artículos del Blog"
    folder: "blog/posts"
    create: true
    slug: "{{slug}}"
    i18n: true
    fields:
      - {label: "Título (H1)", name: "title", widget: "string", i18n: true}
      - label: "Categoría"
        name: "category"
        widget: "select"
        i18n: true
        options:
          - "🔬 Ciencia de la Piel"
          - "🌱 Sostenibilidad y Ecología"
          - "🧘‍♀️ Rutinas y Skinimalismo"
          - "⚖️ Comparativas y Economía"
          - "🏜️ Guías Regionales y Clima"
          - "🧼 Uso y Cuidado del Producto"
          - "💬 Testimonios y Estilo de Vida"
          - "📈 Tendencias Globales"
      - {label: "Descripción Breve", name: "description", widget: "text", i18n: true, hint: "Aparecerá en el índice y metadatos SEO"}
      - label: "Archivos Multimedia (Portada y ZigZag)"
        name: "media"
        widget: "list"
        i18n: true
        required: false
        hint: "Puedes subir 1 o más fotos y videos (.mp4). Se organizarán automáticamente."
        field: {label: "Archivo", name: "file", widget: "file"}
      - {label: "Cuerpo del Artículo", name: "body", widget: "markdown", i18n: true}
